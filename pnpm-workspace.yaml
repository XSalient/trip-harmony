# pnpm settings, in the file pnpm 11 reads them from.
#
# pnpm 11 stopped reading the `pnpm` field in package.json. It says so and
# carries on, which is the dangerous part: `patchedDependencies` being dropped
# means the wouter patch is silently not applied, and you get a clean install
# of a subtly wrong tree. The visible ERR_PNPM_IGNORED_BUILDS failure is the
# only reason anyone notices.
#
# These values are duplicated in package.json, which is where pnpm 10 — the
# version this repo pins and CI uses — still reads them. Keep the two in step
# until the pinned version moves past 10, then delete the package.json copy.
# Duplication is the price of spanning both majors; a silently unpatched
# dependency is worse.

# Not a monorepo. pnpm 10 refuses to read this file at all without `packages`,
# and an empty list is the honest answer: the root is the only package.
packages: []

patchedDependencies:
  wouter@3.7.1: patches/wouter@3.7.1.patch

overrides:
  tailwindcss>nanoid: 3.3.7

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - protobufjs
