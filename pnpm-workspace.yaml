# pnpm settings, in the file pnpm 11 reads them from.
#
# pnpm 11 stopped reading the `pnpm` field in package.json. It prints a warning
# and continues, which is the dangerous half: `patchedDependencies` goes with
# it, so the wouter patch is silently not applied and you get a clean install
# of a subtly wrong tree. The visible ERR_PNPM_IGNORED_BUILDS failure is the
# only thing that makes anyone look.
#
# These values are duplicated in package.json, where pnpm 10.4.1 — the version
# this repo pins and CI runs — reads them, and where it does not read this
# file. Keep the two in step until the pinned version moves past 10, then
# delete the package.json copy. Duplication is the price of spanning both
# majors; a silently unpatched dependency is worse.

# Not a monorepo. pnpm 10 refuses to read this file at all without `packages`,
# and an empty list is the honest answer: the root is the only package.
packages: []

patchedDependencies:
  wouter@3.7.1: patches/wouter@3.7.1.patch

overrides:
  tailwindcss>nanoid: 3.3.7

# The pnpm 11 spelling of package.json's `onlyBuiltDependencies`. v11 removed
# that setting outright — along with neverBuiltDependencies and
# ignoredBuiltDependencies — in favour of this map, so the old name must not
# appear in this file even though package.json still needs it for pnpm 10.
# These three compile native code at install time: the CSS engine, the bundler
# and protobuf's parser. Without them the frontend build has no Tailwind.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  protobufjs: true
